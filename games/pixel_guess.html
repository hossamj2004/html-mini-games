<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Pixel - Retro Mini Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 500px;
            text-align: center;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #canvas-container {
            position: relative;
            width: 400px;
            height: 300px;
            margin: 20px auto;
            border: 4px solid #333;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #input-area {
            margin-top: 20px;
        }
        input {
            padding: 10px;
            font-size: 18px;
            width: 250px;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #score-display {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #message {
            margin-top: 15px;
            height: 24px;
            font-weight: bold;
        }
        #back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">Score: 0</div>
        <div id="canvas-container">
            <canvas id="gameCanvas" width="400" height="300"></canvas>
        </div>
        <div id="input-area">
            <input type="text" id="guess-input" placeholder="Type the car brand...">
            <button id="guess-btn">GUESS</button>
        </div>
        <div id="message"></div>
        <a href="../index.html" id="back-link">Back to Home</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const guessInput = document.getElementById('guess-input');
        const guessBtn = document.getElementById('guess-btn');
        const messageDisplay = document.getElementById('message');
        const scoreDisplay = document.getElementById('score-display');

        const images = [
            { src: '../imgs/bmw/1.jpg', brand: 'BMW' },
            { src: '../imgs/mercedes/1.jpg', brand: 'MERCEDES' },
            { src: '../imgs/ford/1.jpg', brand: 'FORD' },
            { src: '../imgs/spark/1.jpg', brand: 'SPARK' },
            { src: '../imgs/tigo/1.jpg', brand: 'TIGO' },
            { src: '../imgs/saipa1/1.jpg', brand: 'SAIPA' }
        ];

        let currentImgIndex = 0;
        let pixelSize = 50;
        let score = 0;
        let img = new Image();
        let gameActive = false;

        function loadNextImage() {
            if (currentImgIndex >= images.length) {
                messageDisplay.textContent = "CONGRATS! YOU GUESSED ALL.";
                gameActive = false;
                return;
            }

            gameActive = true;
            pixelSize = 50;
            img.src = images[currentImgIndex].src;
            img.onload = () => {
                drawPixelated();
                startSharpening();
            };
        }

        function drawPixelated() {
            const w = canvas.width;
            const h = canvas.height;

            // Draw small
            const smallW = Math.ceil(w / pixelSize);
            const smallH = Math.ceil(h / pixelSize);

            ctx.drawImage(img, 0, 0, smallW, smallH);

            // Stretch back
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(canvas, 0, 0, smallW, smallH, 0, 0, w, h);
        }

        let sharpenInterval;
        function startSharpening() {
            clearInterval(sharpenInterval);
            sharpenInterval = setInterval(() => {
                if (pixelSize > 1) {
                    pixelSize -= 1;
                    drawPixelated();
                } else {
                    clearInterval(sharpenInterval);
                }
            }, 500);
        }

        function handleGuess() {
            if (!gameActive) return;

            const guess = guessInput.value.toUpperCase().trim();
            const correctBrand = images[currentImgIndex].brand.toUpperCase();

            if (guess === correctBrand) {
                const points = Math.floor(pixelSize * 2);
                score += points;
                scoreDisplay.textContent = `Score: ${score}`;
                messageDisplay.textContent = `CORRECT! +${points} points`;
                messageDisplay.style.color = '#4caf50';

                gameActive = false;
                clearInterval(sharpenInterval);
                pixelSize = 1;
                drawPixelated();

                setTimeout(() => {
                    currentImgIndex++;
                    guessInput.value = "";
                    messageDisplay.textContent = "";
                    loadNextImage();
                }, 2000);
            } else {
                messageDisplay.textContent = "WRONG! TRY AGAIN";
                messageDisplay.style.color = '#f44336';
            }
        }

        guessBtn.onclick = handleGuess;
        guessInput.onkeydown = (e) => { if (e.key === 'Enter') handleGuess(); };

        loadNextImage();

        // Expose for verification
        window.game = {
            get score() { return score; },
            get currentImgIndex() { return currentImgIndex; },
            get pixelSize() { return pixelSize; }
        };
    </script>
</body>
</html>

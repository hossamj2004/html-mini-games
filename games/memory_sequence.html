<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Sequence - Retro Mini Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Press Start 2P', cursive, sans-serif;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
        }
        #pads-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            position: relative;
        }
        .pad {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.1s, transform 0.1s;
            border: 4px solid rgba(0,0,0,0.3);
        }
        .pad:active {
            transform: scale(0.95);
        }
        .pad.active {
            opacity: 1;
            box-shadow: 0 0 20px currentColor;
        }
        #green { background-color: #4caf50; color: #4caf50; }
        #red { background-color: #f44336; color: #f44336; }
        #yellow { background-color: #ffeb3b; color: #ffeb3b; }
        #blue { background-color: #2196f3; color: #2196f3; }

        #info-panel {
            margin-bottom: 20px;
        }
        #status {
            font-size: 18px;
            height: 30px;
            margin-top: 10px;
        }
        #score {
            font-size: 24px;
        }
        button {
            background-color: #fff;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 20px;
        }
        #back-link {
            display: block;
            margin-top: 30px;
            color: #888;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info-panel">
            <div id="score">LEVEL: 1</div>
            <div id="status">WATCH CAREFULLY</div>
        </div>
        <div id="pads-container">
            <div id="green" class="pad" onclick="handlePadClick(0)"></div>
            <div id="red" class="pad" onclick="handlePadClick(1)"></div>
            <div id="yellow" class="pad" onclick="handlePadClick(2)"></div>
            <div id="blue" class="pad" onclick="handlePadClick(3)"></div>
        </div>
        <button id="start-btn">START</button>
        <a href="../index.html" id="back-link">Back to Home</a>
    </div>

    <script>
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let isWatching = true;
        let padIds = ['green', 'red', 'yellow', 'blue'];

        const padsContainer = document.getElementById('pads-container');
        const statusText = document.getElementById('status');
        const scoreText = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');

        function startGame() {
            sequence = [];
            level = 1;
            startBtn.style.display = 'none';
            nextLevel();
        }

        function nextLevel() {
            playerSequence = [];
            isWatching = true;
            scoreText.textContent = `LEVEL: ${level}`;
            statusText.textContent = 'WATCH CAREFULLY';

            // Add new step
            sequence.push(Math.floor(Math.random() * 4));

            // Optional Shuffle Twist every 3 levels
            if (level > 3 && level % 3 === 0) {
                shufflePads();
            }

            playSequence();
        }

        function shufflePads() {
            const pads = Array.from(padsContainer.children);
            for (let i = pads.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                padsContainer.appendChild(pads[j]);
            }
        }

        async function playSequence() {
            await new Promise(r => setTimeout(r, 1000));
            for (let i = 0; i < sequence.length; i++) {
                const padIndex = sequence[i];
                await lightUp(padIndex);
                await new Promise(r => setTimeout(r, 300));
            }
            isWatching = false;
            statusText.textContent = 'YOUR TURN!';
        }

        function lightUp(index) {
            return new Promise(r => {
                const id = padIds[index];
                const element = document.getElementById(id);
                element.classList.add('active');
                // Procedural sound placeholder
                playSound(index);
                setTimeout(() => {
                    element.classList.remove('active');
                    r();
                }, 500);
            });
        }

        function playSound(index) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            const freqs = [261.63, 329.63, 392.00, 523.25];
            oscillator.frequency.setValueAtTime(freqs[index], audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4);
        }

        function handlePadClick(index) {
            if (isWatching) return;

            lightUp(index);
            playerSequence.push(index);

            const currentStep = playerSequence.length - 1;
            if (playerSequence[currentStep] !== sequence[currentStep]) {
                gameOver();
                return;
            }

            if (playerSequence.length === sequence.length) {
                level++;
                setTimeout(nextLevel, 1000);
            }
        }

        function gameOver() {
            statusText.textContent = 'WRONG SEQUENCE!';
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'TRY AGAIN';
            isWatching = true;
        }

        startBtn.onclick = startGame;

        // Expose state for verification
        window.game = {
            get level() { return level; },
            get sequence() { return sequence; },
            get isWatching() { return isWatching; }
        };
    </script>
</body>
</html>

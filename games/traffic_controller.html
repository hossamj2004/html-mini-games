<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Controller - Retro Mini Games</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 600px;
            background-color: #34495e;
            border: 5px solid #2c3e50;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #score-board {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #back-link {
            margin-top: 20px;
            color: #bdc3c7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="ui-layer">
            <div id="score-board">Safe Crossings: 0</div>
            <div id="overlay">
                <h1 id="overlay-title">TRAFFIC CONTROLLER</h1>
                <p id="overlay-desc">Tap cars to STOP/START them. Prevent collisions!</p>
                <button id="start-btn">START GAME</button>
                <a href="../index.html" id="back-link">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let cars = [];
        let spawnTimer = 0;
        let spawnRate = 120;

        const ROAD_WIDTH = 120;
        const CAR_SIZE = { w: 40, h: 70 };

        const SPAWN_POINTS = [
            { x: 300 - ROAD_WIDTH/4, y: -CAR_SIZE.h, dx: 0, dy: 1, angle: 0 }, // Top
            { x: 300 + ROAD_WIDTH/4, y: 600, dx: 0, dy: -1, angle: Math.PI }, // Bottom
            { x: -CAR_SIZE.h, y: 300 + ROAD_WIDTH/4, dx: 1, dy: 0, angle: Math.PI/2 }, // Left
            { x: 600, y: 300 - ROAD_WIDTH/4, dx: -1, dy: 0, angle: -Math.PI/2 } // Right
        ];

        class Car {
            constructor(spawn) {
                this.x = spawn.x;
                this.y = spawn.y;
                this.dx = spawn.dx;
                this.dy = spawn.dy;
                this.angle = spawn.angle;
                this.speed = 2 + Math.random() * 1.5;
                this.originalSpeed = this.speed;
                this.stopped = false;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
                this.width = (this.dx === 0) ? CAR_SIZE.w : CAR_SIZE.h;
                this.height = (this.dx === 0) ? CAR_SIZE.h : CAR_SIZE.w;
            }

            update() {
                if (!this.stopped) {
                    this.x += this.dx * this.speed;
                    this.y += this.dy * this.speed;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.angle);

                // Car Body
                ctx.fillStyle = this.color;
                ctx.fillRect(-CAR_SIZE.w/2, -CAR_SIZE.h/2, CAR_SIZE.w, CAR_SIZE.h);

                // Roof
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-CAR_SIZE.w/2 + 5, -CAR_SIZE.h/2 + 15, CAR_SIZE.w - 10, CAR_SIZE.h - 30);

                // Lights
                ctx.fillStyle = 'white';
                ctx.fillRect(-CAR_SIZE.w/2 + 5, -CAR_SIZE.h/2, 10, 5);
                ctx.fillRect(CAR_SIZE.w/2 - 15, -CAR_SIZE.h/2, 10, 5);

                if (this.stopped) {
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-CAR_SIZE.w/2 - 2, -CAR_SIZE.h/2 - 2, CAR_SIZE.w + 4, CAR_SIZE.h + 4);
                }

                ctx.restore();
            }

            getBounds() {
                return {
                    left: this.x,
                    right: this.x + this.width,
                    top: this.y,
                    bottom: this.y + this.height
                };
            }
        }

        function drawMap() {
            // Background
            ctx.fillStyle = '#27ae60'; // Grass
            ctx.fillRect(0, 0, 600, 600);

            // Roads
            ctx.fillStyle = '#7f8c8d'; // Asphalt
            ctx.fillRect(300 - ROAD_WIDTH/2, 0, ROAD_WIDTH, 600); // Vertical
            ctx.fillRect(0, 300 - ROAD_WIDTH/2, 600, ROAD_WIDTH); // Horizontal

            // Lines
            ctx.strokeStyle = 'white';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(300, 0); ctx.lineTo(300, 600);
            ctx.moveTo(0, 300); ctx.lineTo(600, 300);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function checkCollisions() {
            for (let i = 0; i < cars.length; i++) {
                for (let j = i + 1; j < cars.length; j++) {
                    const b1 = cars[i].getBounds();
                    const b2 = cars[j].getBounds();

                    if (b1.left < b2.right && b1.right > b2.left &&
                        b1.top < b2.bottom && b1.bottom > b2.top) {
                        gameOver();
                        return;
                    }
                }
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            spawnTimer++;
            if (spawnTimer > spawnRate) {
                const spawn = SPAWN_POINTS[Math.floor(Math.random() * SPAWN_POINTS.length)];
                cars.push(new Car(spawn));
                spawnTimer = 0;
                spawnRate = Math.max(40, 120 - Math.floor(score / 5) * 10);
            }

            for (let i = cars.length - 1; i >= 0; i--) {
                cars[i].update();

                // Out of bounds
                if (cars[i].x < -100 || cars[i].x > 700 || cars[i].y < -100 || cars[i].y > 700) {
                    cars.splice(i, 1);
                    score++;
                    scoreBoard.textContent = `Safe Crossings: ${score}`;
                }
            }

            checkCollisions();
        }

        function draw() {
            ctx.clearRect(0, 0, 600, 600);
            drawMap();
            cars.forEach(car => car.draw());
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            overlay.style.display = 'flex';
            overlayTitle.textContent = 'COLLISION!';
            startBtn.textContent = 'RETRY';
        }

        function resetGame() {
            score = 0;
            cars = [];
            spawnTimer = 0;
            spawnRate = 120;
            scoreBoard.textContent = `Safe Crossings: ${score}`;
            gameState = 'PLAYING';
            overlay.style.display = 'none';
        }

        startBtn.addEventListener('click', resetGame);

        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let car of cars) {
                const b = car.getBounds();
                if (mouseX > b.left && mouseX < b.right && mouseY > b.top && mouseY < b.bottom) {
                    car.stopped = !car.stopped;
                    break;
                }
            }
        });

        loop();

        // Expose state for verification
        window.game = {
            get score() { return score; },
            get carsCount() { return cars.length; },
            get gameState() { return gameState; }
        };
    </script>
</body>
</html>
